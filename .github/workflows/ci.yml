name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: policyguard
          POSTGRES_PASSWORD: policyguard
          POSTGRES_DB: policyguard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U policyguard -d policyguard_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      LLM_BASE_URL: ""
      LLM_API_KEY: ""
      LLM_MODEL: ""
      EMBEDDING_BASE_URL: ""
      EMBEDDING_API_KEY: ""
      EMBEDDING_MODEL: ""
      POSTGRES_TEST_URL: postgresql+psycopg://policyguard:policyguard@127.0.0.1:5432/policyguard_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev,pdf,mcp,postgres]"
      - name: Lint
        run: ruff check src tests --select E9,F63,F7,F82
      - name: Validate published data evidence
        run: python -m policyguard.scripts.publish_data_evidence --validate
      - name: Test
        run: pytest
