[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "policyguard-ai"
version = "0.1.0"
description = "An evidence-first product compliance review and remediation platform."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.28,<1.0",
  "numpy>=1.26,<2.0",
  "openpyxl>=3.1,<4.0",
  "pydantic>=2.10,<3.0",
  "python-dotenv>=1.0,<2.0",
  "python-multipart>=0.0.20,<1.0",
  "PyJWT[crypto]>=2.10,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
  "alembic>=1.14,<2.0",
  "httpx>=0.28,<1.0",
  "pytest>=8.3,<9.0",
  "pytest-cov>=6.0,<7.0",
  "ruff>=0.11,<1.0",
]
postgres = ["psycopg[binary]>=3.2,<4.0"]
observability = [
  "opentelemetry-api>=1.31,<2.0",
  "opentelemetry-sdk>=1.31,<2.0",
  "opentelemetry-exporter-otlp-proto-http>=1.31,<2.0",
]
loadtest = ["locust>=2.37,<3.0"]
mcp = ["mcp>=1.28,<2.0"]
local-embedding = ["sentence-transformers>=3.0,<6.0"]
local-embedding-onnx = ["fastembed>=0.7,<1.0"]
pdf = [
  "pdfplumber==0.11.4",
  "pypdf>=5.0,<7.0",
  "Pillow>=10.3,<12.0",
  "reportlab>=4.2,<5.0",
]

[project.scripts]
policyguard-mcp = "policyguard.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
policyguard = ["web/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
