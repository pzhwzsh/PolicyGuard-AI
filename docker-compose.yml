services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: policyguard
      POSTGRES_USER: policyguard
      POSTGRES_PASSWORD: policyguard
    ports:
      - "5432:5432"
    volumes:
      - policyguard_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U policyguard -d policyguard"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  policyguard_postgres:

